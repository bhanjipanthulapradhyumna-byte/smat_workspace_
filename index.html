<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111318">
<title>SMAT — Scientific MATLAB Workspace</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

<header class="topbar">
  <div class="brand">
    <div class="logo">S</div>
    <div>
      <h1>SMAT</h1>
      <span>MATLAB-compatible scientific workspace</span>
    </div>
  </div>

  <div class="actions">
    <button id="newBtn">New</button>
    <button id="saveBtn">Save</button>
    <button id="saveAsBtn">Save As</button>
    <button id="runBtn" class="run">▶ Run</button>
    <button id="stopBtn">■ Stop</button>
    <button id="clearBtn">Clear</button>
  </div>
</header>

<main class="workspace">

<section class="editorPanel panel">
  <div class="panelHeader">
    <div class="fileBox">
      <span>Current file</span>
      <input id="filename" value="untitled.m">
    </div>
    <span id="status" class="status">Ready</span>
  </div>

  <div class="editor">
    <div id="lineNumbers" class="lineNumbers">1</div>
    <textarea id="code" spellcheck="false"
      autocapitalize="off" autocomplete="off" autocorrect="off">% SMAT / MATLAB-compatible example

clear;
clc;
close all;

t = 0:0.01:10;
x = sin(t);
y = cos(t);

figure;

plot(t,x);
hold on;
plot(t,y);

grid on;

xlabel('Time');
ylabel('Value');

title('SMAT MATLAB Plot');

fprintf('Maximum sine value = %.4f\n', max(x));</textarea>
  </div>
</section>

<section class="rightColumn">

<section class="outputPanel panel">
  <div class="panelHeader">
    <div>
      <strong>Command Window</strong>
      <span>Program output</span>
    </div>
    <span id="executionState" class="status">Idle</span>
  </div>

  <pre id="output"></pre>
  <div id="warnings"></div>
</section>

<section class="figuresPanel panel">
  <div class="panelHeader">
    <div>
      <strong>Figures</strong>
      <span>2-D / 3-D plots generated by Octave</span>
    </div>
  </div>

  <div id="figures" class="figures"></div>
</section>

</section>
</main>
</div>

<script src="app.js"></script>
</body>
</html>
